- name: recursive CTE with search and cycle
  sql: >-
    with recursive walk(id) as (values (1) union all select id + 1 from walk where id < 3)
    search breadth first by id set visit_order
    cycle id set is_cycle to text 'yes' default text 'no' using visit_path
    select * from walk

- name: nested join grouping window and locking
  sql: >-
    select u.id, count(o.id) as order_count,
           row_number() over (partition by u.account_id order by o.created_at) as position
    from public.users as u
    left join public.orders as o on o.user_id = u.id and o.deleted_at is null
    where u.active = true
    group by u.id, u.account_id, o.created_at
    having count(o.id) > 0
    order by order_count desc nulls last
    limit 20 offset 5
    for update of u skip locked

- name: lateral subquery and table function
  sql: >-
    select u.id, recent.total
    from public.users as u
    cross join lateral (
      select sum(o.amount) as total
      from public.orders as o
      where o.user_id = u.id
    ) as recent
    left join lateral generate_series(1, 3) as bucket(value) on true

- name: grouping sets
  sql: >-
    select a, b, c, d from t
    group by distinct grouping sets ((a, b), rollup(c, d), cube(a, c), ())

- name: ordered aggregates and explicit operator
  sql: >-
    select array_agg(value order by key using operator(pg_catalog.<) nulls first),
           percentile_cont(0.5) within group (order by score using ->)

- name: xml table
  sql: >-
    select * from xmltable(
      xmlnamespaces('urn:items' as item_ns),
      '/items/item' passing document_xml
      columns ord for ordinality,
              id int path '@id' not null,
              name text default 'unknown' path 'name'
    ) as item_rows

- name: json table
  sql: >-
    select * from lateral json_table(
      doc format json,
      '$.items[*]' as root passing 7 as threshold
      columns (
        ord for ordinality,
        id int path '$.id',
        payload jsonb format json path '$' with conditional array wrapper
          keep quotes null on empty error on error,
        present boolean exists path '$.id' false on error,
        nested path '$.children[*]' as child
          columns (child_id int path '$.id')
      )
    ) as rows

- name: insert conflict returning aliases
  sql: >-
    insert into items (id, name) overriding system value values (1, 'one')
    on conflict (id) where id > 0
    do update set name = 'updated' where items.id > 0
    returning with (old as previous, new as current) id

- name: update from returning
  sql: >-
    update public.items
    set name = audit.new_name, updated_at = current_timestamp
    from audit
    where items.id = audit.id
    returning items.id

- name: delete using returning
  sql: >-
    delete from public.items
    using audit
    where items.id = audit.id
    returning with (old as previous, new as current) previous.id

- name: merge all action families
  sql: >-
    merge into target t using source s on t.id = s.id
    when matched and s.deleted = true then delete
    when matched then update set name = s.name
    when not matched by target then
      insert (id, name) overriding system value values (s.id, s.name)
    when not matched by source then do nothing
    returning t.id

- name: create table with inheritance partition and storage
  sql: >-
    create table events (
      like event_template including defaults excluding indexes,
      id int,
      created_at timestamptz not null,
      constraint positive_id check (id > 0) not valid
    ) inherits (base_events)
    partition by range (created_at collate pg_catalog."C" app.timestamp_ops, lower(id), (id + 1))
    using heap with (fillfactor = 80) tablespace fast_space

- name: create index element options
  sql: >-
    create index item_search on app.items (
      name collate pg_catalog."C" text_pattern_ops (deduplicate_items = false) desc nulls first,
      lower(code) app.custom_ops asc nulls last,
      (id + 1)
    ) include (id int4_ops)

- name: alter table command list
  sql: >-
    alter table app.items
      add column score integer,
      alter column score set default 1 + 2,
      alter column score set not null,
      alter column score set (n_distinct = 10),
      drop column if exists obsolete cascade

- name: create function options
  sql: >-
    create or replace function app.compute(
      a int,
      in label text default 'x',
      out total bigint
    ) returns int
    language sql immutable strict security definer parallel safe
    cost 10 rows 1
    as 'select 1'

- name: grant column privileges
  sql: >-
    grant select(id), update(name)
    on table app.items
    to alice, group analysts
    with grant option granted by admin

- name: revoke grant option
  sql: >-
    revoke grant option for select
    on table app.items
    from public granted by admin cascade

- name: publication objects and filter
  sql: >-
    create publication item_changes
    for table app.items (id, name) where (active = true),
        tables in schema public
    with (publish = 'insert, update')

- name: copy options and predicate
  sql: >-
    copy app.items (id, name)
    from program 'cat data.csv'
    with (format csv, header true, delimiter ',')
    where id > 0

- name: explain options
  sql: >-
    explain (analyze true, verbose true, costs false, format json)
    select * from app.items where active = true

- name: property graph query
  sql: >-
    select * from graph_table(
      social
      match (person is person_label)-[edge is knows]->(friend is person_label)
      where person.active = true
      columns (person.id as person_id, friend.id as friend_id)
    ) as graph_rows
